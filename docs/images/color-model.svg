<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="cmTitle cmDesc">
  <title id="cmTitle">The four-axis colour model</title>
  <desc id="cmDesc">Brand, neutral, value structure and state axes, each with its own chroma ceiling, feeding the 119-token palette and the elevation ladder.</desc>
  <defs>
    <linearGradient id="cmHue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f43f5e"/><stop offset=".16" stop-color="#f59e0b"/>
      <stop offset=".33" stop-color="#84cc16"/><stop offset=".5" stop-color="#10b981"/>
      <stop offset=".66" stop-color="#0ea5e9"/><stop offset=".83" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cmLadder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset=".55" stop-color="#e7ebe9"/><stop offset="1" stop-color="#d4dbd7"/>
    </linearGradient>
  </defs>
  <rect width="960" height="460" fill="#f7f9f8"/>
  <rect x="0" y="0" width="960" height="64" fill="#0f1a16"/>
  <text x="32" y="39" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="21" font-weight="600" fill="#f2f7f5">四轴色彩模型</text>
  <text x="928" y="39" text-anchor="end" font-family="ui-monospace, Consolas" font-size="12" fill="#9fd8c4">theme-spec · v3</text>

  <!-- axis 1: brand -->
  <g transform="translate(32 96)">
    <rect width="208" height="150" rx="14" fill="#ffffff" stroke="#dfe7e3"/>
    <text x="18" y="30" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="14" font-weight="600" fill="#16211d">① 品牌轴</text>
    <text x="18" y="50" font-family="ui-monospace, Consolas" font-size="11" fill="#77857f">th · c1 · l1</text>
    <rect x="18" y="64" width="172" height="12" rx="6" fill="url(#cmHue)"/>
    <circle cx="86" cy="70" r="8" fill="#ffffff" stroke="#137b5e" stroke-width="2.5"/>
    <text x="18" y="100" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="11.5" fill="#4c5a55">彩度上限 0.37（唯一不设封顶的轴）</text>
    <text x="18" y="120" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="11.5" fill="#4c5a55">驱动 brand / link / button / focus</text>
    <text x="18" y="140" font-family="ui-monospace, Consolas" font-size="11" fill="#137b5e">38 tokens</text>
  </g>

  <!-- axis 2: neutral tint -->
  <g transform="translate(256 96)">
    <rect width="208" height="150" rx="14" fill="#ffffff" stroke="#dfe7e3"/>
    <text x="18" y="30" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="14" font-weight="600" fill="#16211d">② 中性轴</text>
    <text x="18" y="50" font-family="ui-monospace, Consolas" font-size="11" fill="#77857f">ths · sc</text>
    <g transform="translate(18 62)">
      <rect width="34" height="34" rx="8" fill="#eef3f0" stroke="#dfe7e3"/>
      <rect x="42" width="34" height="34" rx="8" fill="#e6eeea" stroke="#d8e2dd"/>
      <rect x="84" width="34" height="34" rx="8" fill="#dfe9e4" stroke="#cfdcd5"/>
      <rect x="126" width="34" height="34" rx="8" fill="#d7e3dd" stroke="#c6d5ce"/>
    </g>
    <text x="18" y="118" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="11.5" fill="#4c5a55">彩度上限 0.012，给灰面一点品牌温度</text>
    <text x="18" y="138" font-family="ui-monospace, Consolas" font-size="11" fill="#137b5e">15 tokens</text>
  </g>

  <!-- axis 3: value structure -->
  <g transform="translate(480 96)">
    <rect width="208" height="150" rx="14" fill="#ffffff" stroke="#dfe7e3"/>
    <text x="18" y="30" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="14" font-weight="600" fill="#16211d">③ 明度骨架</text>
    <text x="18" y="50" font-family="ui-monospace, Consolas" font-size="11" fill="#77857f">bg · spread · l1 · tx</text>
    <g transform="translate(18 62)">
      <rect width="54" height="10" rx="5" fill="url(#cmLadder)"/>
      <rect y="18" width="72" height="10" rx="5" fill="#dfe9e4"/>
      <rect y="36" width="90" height="10" rx="5" fill="#c9dcdd"/>
      <rect y="54" width="108" height="10" rx="5" fill="#137b5e"/>
    </g>
    <text x="18" y="118" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="11.5" fill="#4c5a55">4 档 elevation，暗色跨度自动 ×1.6</text>
    <text x="18" y="138" font-family="ui-monospace, Consolas" font-size="11" fill="#137b5e">34 tokens</text>
  </g>

  <!-- axis 4: state -->
  <g transform="translate(704 96)">
    <rect width="224" height="150" rx="14" fill="#ffffff" stroke="#dfe7e3"/>
    <text x="18" y="30" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="14" font-weight="600" fill="#16211d">④ 状态簇</text>
    <text x="18" y="50" font-family="ui-monospace, Consolas" font-size="11" fill="#77857f">stateBoost</text>
    <g transform="translate(18 62)">
      <rect width="40" height="22" rx="6" fill="#e7f6ec" stroke="#b9e3c6"/>
      <rect x="46" width="40" height="22" rx="6" fill="#fff2dd" stroke="#f0d3a2"/>
      <rect x="92" width="40" height="22" rx="6" fill="#fdeaea" stroke="#f3c4c4"/>
      <rect x="138" width="40" height="22" rx="6" fill="#e9f0fd" stroke="#c4d3f3"/>
    </g>
    <text x="18" y="112" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="11.5" fill="#4c5a55">明度上下浮动 ±0.08，色相锁死语义</text>
    <text x="18" y="132" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="11.5" fill="#4c5a55">success / warn / error / info</text>
    <text x="18" y="146" font-family="ui-monospace, Consolas" font-size="11" fill="#137b5e">32 tokens</text>
  </g>

  <!-- output strip -->
  <g transform="translate(32 268)">
    <rect width="896" height="76" rx="14" fill="#ffffff" stroke="#dfe7e3"/>
    <text x="20" y="30" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="13" font-weight="600" fill="#16211d">合成 → 119 个可覆盖令牌</text>
    <text x="20" y="52" font-family="ui-monospace, Consolas" font-size="11" fill="#4c5a55">107 × --dsw-alias-*　11 × --dsw-specific-*　1 × --dsw-menu-surface-fill</text>
    <text x="20" y="68" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="11" fill="#77857f">明暗两套同时生成，切换模式不丢色相</text>
    <g transform="translate(700 18)">
      <rect width="168" height="40" rx="10" fill="#0f1a16"/>
      <text x="84" y="25" text-anchor="middle" font-family="ui-monospace, Consolas" font-size="12" fill="#8af0c6">theme.overrideTokens()</text>
    </g>
  </g>

  <!-- appearance axis -->
  <g transform="translate(32 360)">
    <rect width="432" height="72" rx="14" fill="#fbfdfc" stroke="#dfe7e3" stroke-dasharray="5 4"/>
    <text x="18" y="28" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="13" font-weight="600" fill="#16211d">外观轴（仅预览与导出）</text>
    <text x="18" y="48" font-family="ui-monospace, Consolas" font-size="11" fill="#77857f">fontPair · fontScale · radius · shadow</text>
    <text x="18" y="64" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="11" fill="#8a968f">壳的 theme 服务只接受令牌覆盖，不改自身圆角与字体</text>
  </g>
  <g transform="translate(480 360)">
    <rect width="448" height="72" rx="14" fill="#ffffff" stroke="#dfe7e3"/>
    <text x="18" y="28" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="13" font-weight="600" fill="#16211d">对比度闸门</text>
    <text x="18" y="48" font-family="ui-monospace, Consolas" font-size="11" fill="#4c5a55">正文 7.0　次要 4.5　大字 3.0　控件 3.0（WCAG）+ APCA Lc</text>
    <text x="18" y="64" font-family="ui-sans-serif, Segoe UI, PingFang SC" font-size="11" fill="#8a968f">12 套预设 × 2 模式 × 21 对，全部过线才允许发布</text>
  </g>
</svg>
