<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="FreeStyle theme — an OKLCH theme studio for DeepSeek Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0e"/>
      <stop offset="0.55" stop-color="#0b1117"/>
      <stop offset="1" stop-color="#0d1a18"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3ddc97" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <ellipse cx="300" cy="120" rx="320" ry="200" fill="url(#glowA)"/>
  <ellipse cx="980" cy="300" rx="300" ry="190" fill="url(#glowB)"/>

  <g font-family="Inter,'SF Pro Text','Segoe UI',system-ui,sans-serif">
    <text x="72" y="96" font-size="12" letter-spacing="3.4" fill="#7f8b99">DEEPSEEK HARNESS · THEME PLUGIN</text>
    <text x="70" y="168" font-size="58" font-weight="700" fill="#f2f5f7">FreeStyle 主题</text>
    <text x="72" y="205" font-size="16.5" fill="#9aa4b2">四轴 OKLCH 引擎，为你的 DSH 调一套只属于你的皮肤——<tspan fill="#c9d3dd">119 个令牌，明暗各一套。</tspan></text>

    <g transform="translate(72,246)">
      <g font-size="11.5">
        <rect x="0" y="0" width="118" height="30" rx="15" fill="#121a21" stroke="rgba(255,255,255,0.12)"/>
        <circle cx="17" cy="15" r="4" fill="#3ddc97"/><text x="30" y="19.5" fill="#c8d2dc">实时预览</text>
        <rect x="128" y="0" width="118" height="30" rx="15" fill="#121a21" stroke="rgba(255,255,255,0.12)"/>
        <circle cx="145" cy="15" r="4" fill="#6ea8ff"/><text x="158" y="19.5" fill="#c8d2dc">对比度体检</text>
        <rect x="256" y="0" width="102" height="30" rx="15" fill="#121a21" stroke="rgba(255,255,255,0.12)"/>
        <circle cx="273" cy="15" r="4" fill="#ffd166"/><text x="286" y="19.5" fill="#c8d2dc">12 套预设</text>
        <rect x="368" y="0" width="112" height="30" rx="15" fill="#121a21" stroke="rgba(255,255,255,0.12)"/>
        <circle cx="385" cy="15" r="4" fill="#ff8fa3"/><text x="398" y="19.5" fill="#c8d2dc">分享码</text>
      </g>
    </g>

    <g transform="translate(72,318)" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11">
      <text fill="#5f6b78">pnpm test · 39 passing</text>
      <text x="180" fill="#5f6b78">pnpm check:tokens · 0 missing</text>
    </g>
  </g>

  <!-- three stacked theme cards -->
  <g transform="translate(760,54)">
    <g filter="url(#soft)" opacity="0.55">
      <rect x="24" y="18" width="336" height="300" rx="24" fill="#3ddc97" opacity="0.22"/>
    </g>

    <!-- back card: dark -->
    <g transform="translate(56,40)">
      <rect width="300" height="176" rx="18" fill="#14181d" stroke="rgba(255,255,255,0.10)"/>
      <rect x="0" y="0" width="300" height="176" rx="18" fill="url(#glowA)" opacity="0.5"/>
      <circle cx="20" cy="20" r="4" fill="#2a3038"/><circle cx="34" cy="20" r="4" fill="#2a3038"/><circle cx="48" cy="20" r="4" fill="#2a3038"/>
      <rect x="18" y="40" width="72" height="8" rx="4" fill="#2b323b"/>
      <rect x="18" y="58" width="118" height="8" rx="4" fill="#232a32"/>
      <rect x="18" y="76" width="96" height="8" rx="4" fill="#232a32"/>
      <rect x="18" y="104" width="264" height="28" rx="9" fill="#1b222a" stroke="rgba(255,255,255,0.06)"/>
      <rect x="30" y="114" width="86" height="8" rx="4" fill="#2f3944"/>
      <rect x="236" y="110" width="34" height="16" rx="8" fill="#3ddc97"/>
      <text x="18" y="156" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#6d7886">#0e1216 · ink</text>
    </g>

    <!-- front card: light -->
    <g transform="translate(0,0)">
      <rect width="300" height="176" rx="18" fill="#f7f9f8" stroke="rgba(0,0,0,0.08)"/>
      <circle cx="20" cy="20" r="4" fill="#dfe5e6"/><circle cx="34" cy="20" r="4" fill="#dfe5e6"/><circle cx="48" cy="20" r="4" fill="#dfe5e6"/>
      <rect x="18" y="40" width="72" height="8" rx="4" fill="#dfe5e6"/>
      <rect x="18" y="58" width="132" height="8" rx="4" fill="#cfd8d5"/>
      <rect x="18" y="76" width="104" height="8" rx="4" fill="#d8e0dd"/>
      <rect x="18" y="104" width="264" height="28" rx="9" fill="#ffffff" stroke="rgba(0,0,0,0.07)"/>
      <rect x="30" y="114" width="72" height="8" rx="4" fill="#c3cecb"/>
      <rect x="236" y="110" width="34" height="16" rx="8" fill="#137b5e"/>
      <text x="18" y="156" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#7b8a86">#f7f9f8 · mist</text>
    </g>

    <!-- swatch rail -->
    <g transform="translate(0,206)">
      <g>
        <rect x="0" y="0" width="44" height="44" rx="12" fill="#137b5e"/>
        <rect x="50" y="0" width="44" height="44" rx="12" fill="#3ddc97"/>
        <rect x="100" y="0" width="44" height="44" rx="12" fill="#ffd166"/>
        <rect x="150" y="0" width="44" height="44" rx="12" fill="#ff8fa3"/>
        <rect x="200" y="0" width="44" height="44" rx="12" fill="#6ea8ff"/>
        <rect x="250" y="0" width="44" height="44" rx="12" fill="#b28dff"/>
      </g>
      <text x="0" y="66" font-family="ui-monospace,Menlo,monospace" font-size="9.5" fill="#6d7886">the same 119 tokens, twelve coordinate systems</text>
    </g>
  </g>

  <rect x="0" y="398" width="1200" height="2" fill="url(#rule)"/>
</svg>
