 对</text><rect x="231.7" y="176" width="122.52" height="24" rx="12" fill="#151b22"/><text x="241.7" y="191.96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#b6bdc8" text-anchor="start">12 预设 · 32 传统色</text><rect x="362.21999999999997" y="176" width="53" height="24" rx="12" fill="#151b22"/><text x="372.2" y="191.96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#b6bdc8" text-anchor="start">分享码</text><text x="36.0" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="600" fill="#e8eaed" text-anchor="start">119</text><text x="36.0" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" fill="#8b93a1" text-anchor="start">覆盖令牌</text><text x="168.0" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="600" fill="#e8eaed" text-anchor="start">21</text><text x="168.0" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" fill="#8b93a1" text-anchor="start">对比度配对</text><text x="300.0" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="600" fill="#e8eaed" text-anchor="start">44</text><text x="300.0" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" fill="#8b93a1" text-anchor="start">色板预设</text><text x="432.0" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hirag